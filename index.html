
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase | Online Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>🛍️ ShopEase</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#cart">Cart (<span id="cartCount">0</span>)</a>
      <button id="themeBtn">🌙</button>
    </nav>
  </header>

  <section class="hero" id="home">
    <h2>Welcome to ShopEase</h2>
    <p>Discover quality products at great prices.</p>
    <a href="#products" class="shop-btn">Shop Now</a>
  </section>

  <main>
    <section id="products">
      <h2>Our Products</h2>

      <input type="text" id="searchInput"
        placeholder="Search products...">

      <div class="filters">
        <button data-category="All">All</button>
        <button data-category="Electronics">Electronics</button>
        <button data-category="Fashion">Fashion</button>
        <button data-category="Accessories">Accessories</button>
      </div>

      <div id="productContainer" class="product-grid"></div>
    </section>

    <section id="cart">
      <h2>🛒 Shopping Cart</h2>
      <div id="cartItems"></div>
      <h3>Total: KSh <span id="total">0</span></h3>
      <button id="checkoutBtn">Checkout</button>
    </section>
  </main>

  <footer>
    <p>© 2026 ShopEase. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
